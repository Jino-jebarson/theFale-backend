                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: User moderation status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

# ==============================================================================
# SCHEMAS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"

    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed"
        path:
          type: string
          example: "/api/v1/shifts/123/claim"
        correlationId:
          type: string
          format: uuid

    SendOtpRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: '^[6-9]\d{9}$'
          example: "9876543210"
        email:
          type: string
          format: email
          example: "doctor@hospital.com"
        portal:
          type: string
          enum: [candidate, facility]
          default: candidate

    VerifyOtpRequest:
      type: object
      required: [otp]
      properties:
        phone:
          type: string
          pattern: '^[6-9]\d{9}$'
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'
          example: "123456"

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 900
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            phone:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [ROLE_CANDIDATE, ROLE_FACILITY, ROLE_ADMIN]
            candidateLevel:
              type: string
              enum: [STUDENT, FRESHER, PROFESSIONAL]
            onboarded:
              type: boolean

    VerificationBadgeResponse:
      type: object
      properties:
        verificationId:
          type: string
          format: uuid
        entityType:
          type: string
          enum: [CANDIDATE, FACILITY]
        maskedName:
          type: string
          example: "Dr. A**** P****"
        verified:
          type: boolean
        accreditationText:
          type: string
          example: "State Medical Council Registered"
        verifiedAt:
          type: string
          format: date-time

    CandidateOnboardingRequest:
      type: object
      required: [name, city, candidateLevel]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          maxLength: 50
        candidateLevel:
          type: string
          enum: [STUDENT, FRESHER, PROFESSIONAL]
        # Student fields
        course:
          type: string
          maxLength: 100
        college:
          type: string
          maxLength: 150
        studyYear:
          type: string
          enum: ["1st year", "2nd year", "3rd year", "4th year", "Internship year"]
        universityRegNo:
          type: string
          maxLength: 50
        # Graduate fields
        profession:
          type: string
          maxLength: 50
        specialty:
          type: string
          maxLength: 100
        qualification:
          type: string
          maxLength: 100
        council:
          type: string
          maxLength: 100
        regNumber:
          type: string
          maxLength: 50
        regYear:
          type: string
          maxLength: 4
        experienceYears:
          type: string
          maxLength: 30

    CandidateProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        city:
          type: string
        candidateLevel:
          type: string
          enum: [STUDENT, FRESHER, PROFESSIONAL]
        kycStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        course:
          type: string
        college:
          type: string
        studyYear:
          type: string
        universityRegNo:
          type: string
        profession:
          type: string
        specialty:
          type: string
        qualification:
          type: string
        council:
          type: string
        regNumber:
          type: string
        profileCompleteness:
          type: integer

    CandidateUpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 50
        specialty:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000

    StudentUpgradeRequest:
      type: object
      required: [qualification, council, regNumber]
      properties:
        qualification:
          type: string
          maxLength: 100
        council:
          type: string
          maxLength: 100
        regNumber:
          type: string
          maxLength: 50

    StudentUpgradeItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        candidateName:
          type: string
        college:
          type: string
        course:
          type: string
        qualification:
          type: string
        council:
          type: string
        regNumber:
          type: string
        submittedAt:
          type: string
          format: date-time

    DocumentItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentType:
          type: string
        originalFileName:
          type: string
        verified:
          type: boolean
        uploadedAt:
          type: string
          format: date-time

    JobPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/JobDetailResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        number:
          type: integer

    JobDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        org:
          type: string
        city:
          type: string
        dept:
          type: string
        type:
          type: string
        isInternship:
          type: boolean
        salaryMinPaise:
          type: integer
          example: 4500000
        salaryMaxPaise:
          type: integer
          example: 6000000
        openings:
          type: integer
        urgent:
          type: boolean
        match:
          type: integer
        description:
          type: string
        status:
          type: string

    CreateJobRequest:
      type: object
      required: [title, dept, openings, salaryMinPaise, salaryMaxPaise]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        dept:
          type: string
          maxLength: 50
        openings:
          type: integer
          minimum: 1
          maximum: 100
        employmentType:
          type: string
          enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        salaryMinPaise:
          type: integer
          minimum: 1000000
        salaryMaxPaise:
          type: integer
        description:
          type: string
          minLength: 20
          maxLength: 5000

    ShiftPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ShiftItemResponse'
        totalElements:
          type: integer

    ShiftItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        org:
          type: string
        city:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        hours:
          type: integer
          example: 12
        ratePerHourPaise:
          type: integer
          example: 45000
        surgeRatePerHourPaise:
          type: integer
          example: 5000
        dept:
          type: string
        urgent:
          type: boolean
        openings:
          type: integer
        slotsClaimed:
          type: integer
        status:
          type: string
          enum: [PENDING_APPROVAL, OPEN, FILLED, CANCELLED, REJECTED, COMPLETED]

    CreateShiftRequest:
      type: object
      required: [title, dept, startAt, endAt, ratePerHourPaise, openings]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        dept:
          type: string
          maxLength: 50
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        ratePerHourPaise:
          type: integer
          minimum: 20000
        surgeRatePerHourPaise:
          type: integer
          default: 0
        surgeLabel:
          type: string
        urgent:
          type: boolean
        openings:
          type: integer
          minimum: 1
          maximum: 20

    ShiftClaimResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        status:
          type: string
          enum: [CLAIMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED, DISPUTED]
        claimedAt:
          type: string
          format: date-time
        checkedInAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        grossAmountPaise:
          type: integer
        platformFeePaise:
          type: integer
        tdsAmountPaise:
          type: integer
        netAmountPaise:
          type: integer
        payoutStatus:
          type: string
          enum: [IN_ESCROW, PENDING_DISBURSEMENT, DISBURSED, REFUNDED]

    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        jobTitle:
          type: string
        hospitalName:
          type: string
        status:
          type: string
          enum: [PENDING_SCREENING, SHORTLISTED, INTERVIEW, OFFERED, HIRED, REJECTED, WITHDRAWN]
        appliedDate:
          type: string

    CandidateEarningsResponse:
      type: object
      properties:
        totalDisbursedPaise:
          type: integer
        inEscrowPaise:
          type: integer
        payoutMethod:
          type: object
          properties:
            type:
              type: string
              enum: [upi, bank]
            upiId:
              type: string
            accountNumberMasked:
              type: string
            ifsc:
              type: string
            accountHolderName:
              type: string
            status:
              type: string
              enum: [Verified, Pending]
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              shiftTitle:
                type: string
              hospitalName:
                type: string
              hours:
                type: integer
              netAmountPaise:
                type: integer
              payoutDate:
                type: string
              status:
                type: string
              utr:
                type: string

    CandidatePayoutMethodRequest:
      type: object
      required: [type, accountHolderName]
      properties:
        type:
          type: string
          enum: [upi, bank]
        upiId:
          type: string
          pattern: '^[\w.-]+@[\w.-]+$'
        accountNumber:
          type: string
          minLength: 9
          maxLength: 18
        confirmAccountNumber:
          type: string
        ifsc:
          type: string
          pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'
        accountHolderName:
          type: string
          minLength: 2
          maxLength: 100

    CourseSummaryResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        duration:
          type: string
        cmePoints:
          type: integer
        summary:
          type: string
        forStudents:
          type: boolean

    HuddlePostPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/HuddlePostResponse'

    HuddlePostResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorName:
          type: string
        authorRole:
          type: string
        authorLevel:
          type: string
          enum: [student, fresher, professional, hospital]
        verified:
          type: boolean
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [Thought, Experience, Case, Question, Update, Event]
        field:
          type: string
        upvotes:
          type: integer
        commentsCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    HuddleCommentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorName:
          type: string
        authorRole:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    HuddleQuestionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorName:
          type: string
        field:
          type: string
        questionText:
          type: string
        answersCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateHuddlePostRequest:
      type: object
      required: [title, body, type, field]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 150
        body:
          type: string
          minLength: 10
          maxLength: 3000
        type:
          type: string
          enum: [Thought, Experience, Case, Question, Update, Event]
        field:
          type: string
          maxLength: 50

    NotificationItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        message:
          type: string
        type:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateTicketRequest:
      type: object
      required: [subject, description, category]
      properties:
        subject:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 10
          maxLength: 2000
        category:
          type: string
          enum: [ESCROW, KYC, SHIFT_DISPUTE, TECHNICAL]

    SupportTicketResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        createdAt:
          type: string
          format: date-time

    FacilityOnboardingRequest:
      type: object
      required: [contactPerson, hospitalName, type, city, state, beds, licenseNumber]
      properties:
        contactPerson:
          type: string
          minLength: 2
          maxLength: 100
        hospitalName:
          type: string
          minLength: 3
