openapi: 3.0.3
info:
  title: FALE Healthcare Platform Backend API
  description: >-
    Production-grade, OWASP-aligned REST API for FALE Healthcare Platform.
    Enforces strict persona boundaries (Healthcare Students, Graduate Clinicians,
    Healthcare Facilities, and Compliance Administrators).
    
    MONEY CONVENTION:
    All monetary amounts in request and response payloads are represented as
    integer PAISE (1 INR = 100 paise) to eliminate floating-point precision errors.
    
    SECURITY & CSRF CONVENTION:
    Access tokens (JWT, 15m) are transmitted via the Authorization header (Bearer token).
    Refresh tokens (7d) are stored and transmitted exclusively via HttpOnly, Secure,
    SameSite=Strict cookies ('fale_refresh_token'). Because API requests require
    the Authorization header, CSRF attacks on data endpoints are inherently mitigated.
    The refresh endpoint enforces SameSite=Strict and Origin verification.
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.thefale.com
    description: Production Environment

tags:
  - name: Authentication
    description: Public OTP auth for candidates/facilities, Password+MFA for Admins, token rotation, and logout
  - name: Candidates
    description: Candidate & Student profile management, KYC documents, CV export, and student upgrade requests
  - name: Jobs
    description: Public & candidate job search, filters, internships, and applications
  - name: Shifts
    description: Locum shift dispatch marketplace, duty claiming, check-in, dispute, and cancellation
  - name: Applications
    description: Candidate application tracking and withdrawal
  - name: Payouts
    description: Escrow disbursements, bank account/UPI configuration, PDF payout slips
  - name: Courses
    description: CME & learning academy modules, progression, and certification
  - name: Huddle
    description: Clinical community posts, comments, questions, answers, and moderation flags
  - name: Notifications
    description: In-app real-time alerts and delivery
  - name: Support
    description: Help center tickets and clinical concierge
  - name: Employer Dashboard
    description: Facility staffing metrics and active roster coverage
  - name: Employer Jobs & Shifts
    description: Hospital job posting, shift dispatch with escrow lock, and shift completion confirmation
  - name: Employer Applications
    description: Applicant review pipeline and interview scheduling
  - name: Employer Talent Resdex
    description: Candidate discovery with contact masking and credit-based unlocking
  - name: Employer Wallet & Escrow
    description: Nodal escrow balance, UTR top-up requests, credit purchases, and ledger
  - name: Admin Compliance
    description: Candidate KYC, Student Upgrades, Hospital Accreditation, Postings, and Huddle Moderation

paths:
  # ============================================================================
  # PUBLIC CREDENTIAL VERIFICATION
  # ============================================================================
  /api/v1/verifications/{id}:
    get:
      tags: [Authentication]
      summary: Public Verification Check by QR/ID
      description: Returns masked verification badge for candidate or hospital accreditation.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification badge details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationBadgeResponse'
        '404':
          description: Verification record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  /api/v1/auth/otp/send:
    post:
      tags: [Authentication]
      summary: Request 6-digit OTP for Mobile or Email
      description: >-
        Public endpoint. Rate-limited to 3 requests per 15 minutes per IP/contact via Bucket4j.
        Returns generic response to prevent phone/email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP dispatched if account exists or eligible for signup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: Rate limit exceeded (Too Many Requests)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/otp/verify:
    post:
      tags: [Authentication]
      summary: Verify OTP and Obtain JWT Access Token
      description: >-
        Public endpoint. Sets rotating refresh token in HttpOnly, Secure, SameSite=Strict cookie.
        Returns access token in response body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Successfully authenticated
          headers:
            Set-Cookie:
              description: HttpOnly, Secure, SameSite=Strict refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/admin/login:
    post:
      tags: [Authentication]
      summary: Admin Password Login (Initiates MFA)
      description: Admin accounts only. Never self-signed-up. Requires MFA verification step.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Password valid; MFA code required
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaRequired:
                    type: boolean
                    example: true
                  mfaSessionToken:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/admin/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify Admin TOTP MFA Code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaSessionToken, totpCode]
              properties:
                mfaSessionToken:
                  type: string
                totpCode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: MFA verified; admin session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate Refresh Token
      description: >-
        Reads refresh token from HttpOnly cookie. Issues new access token and rotates cookie.
        Implements reuse detection.
      security: []
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate Session and Clear Refresh Cookie
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          headers:
            Set-Cookie:
              description: Clears refresh cookie with Max-Age=0
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================================
  # CANDIDATE PROFILE & ONBOARDING (STUDENT & GRADUATE)
  # ============================================================================
  /api/v1/candidates/onboarding:
    post:
      tags: [Candidates]
      summary: Submit Candidate / Student Onboarding Profile
      description: >-
        Role: ROLE_CANDIDATE. Takes phone/email from authenticated security principal.
        Supports Student pathway (candidateLevel = STUDENT) and Graduate pathway (FRESHER | PROFESSIONAL).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateOnboardingRequest'
      responses:
        '200':
          description: Profile submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfileResponse'

  /api/v1/candidates/me/profile:
    get:
      tags: [Candidates]
      summary: Get Current Candidate / Student Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfileResponse'
    put:
      tags: [Candidates]
      summary: Update Profile (Bio, Specialty, City)
      description: candidateLevel and council verification status are NOT editable by candidate.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfileResponse'

  /api/v1/candidates/me/documents:
    post:
      tags: [Candidates]
      summary: Upload Credential Document
      description: Local storage in dev; private S3-compatible bucket in prod. Whitelisted mime types, max 5MB.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [documentType, file]
              properties:
                documentType:
                  type: string
                  enum: [COLLEGE_ID, BONAFIDE_CERTIFICATE, COUNCIL_REGISTRATION, DEGREE_CERTIFICATE, AADHAAR_KYC, RESUME]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentItemResponse'

  /api/v1/candidates/me/documents/{docId}:
    delete:
      tags: [Candidates]
      summary: Delete an Uploaded Document
      security:
        - BearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/candidates/me/export-cv:
    get:
      tags: [Candidates]
      summary: Export Standard NABH Clinical CV or Student Academic Portfolio (PDF)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Streamed PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/candidates/upgrade-request:
    post:
      tags: [Candidates]
      summary: Request Student-to-Graduate Status Upgrade
      description: >-
        Candidate submits proof of graduation and council license.
        Submitting resets kycStatus to PENDING and places the request into the Admin Upgrade Queue.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpgradeRequest'
      responses:
        '201':
          description: Upgrade request queued for admin review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================================
  # JOBS & INTERNSHIPS
  # ============================================================================
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: Browse Approved Job & Internship Openings
      description: If user has candidate_level = STUDENT, automatically restricted to internships only.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: city
          in: query
          schema:
            type: string
            maxLength: 50
        - name: department
          in: query
          schema:
            type: string
            maxLength: 50
        - name: employmentType
          in: query
          schema:
            type: string
            enum: [FULL_TIME, PART_TIME, CONTRACT, INTERNSHIP]
        - name: internshipsOnly
          in: query
          schema:
            type: boolean
        - name: minSalaryPaise
          in: query
          schema:
            type: integer
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPageResponse'

  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get Job / Internship Details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'

  /api/v1/jobs/{id}/apply:
    post:
      tags: [Jobs]
      summary: Apply for a Job or Internship
      description: Rejects students attempting to apply to non-internship clinical roles with HTTP 403.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '403':
          description: Active students cannot apply to independent clinical jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/jobs/{id}/save:
    post:
      tags: [Jobs]
      summary: Save a Job Posting
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [Jobs]
      summary: Remove Job Posting from Saved List
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job removed from saved list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================================
  # LOCUM SHIFTS & CLAIMS LIFECYCLE
  # ============================================================================
  /api/v1/shifts:
    get:
      tags: [Shifts]
      summary: Browse Available Locum Shifts
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: department
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Available shifts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPageResponse'

  /api/v1/shifts/{id}/claim:
    post:
      tags: [Shifts]
      summary: Claim a Locum Shift Slot
      description: >-
        Restricted to verified Graduate Candidates (ROLE_CANDIDATE with candidate_level != STUDENT).
        Students receive HTTP 403 Forbidden.
        Pessimistic lock on the shift entity prevents double allocation.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shift claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftClaimResponse'
        '403':
          description: Active students cannot take patient locum duties, or KYC unverified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Shift is fully booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/shifts/claims/{claimId}/check-in:
    post:
      tags: [Shifts]
      summary: Candidate Checks In at Hospital Duty
      description: Updates claim status to CHECKED_IN and stamps checked_in_at.
      security:
        - BearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftClaimResponse'

  /api/v1/shifts/claims/{claimId}/cancel:
    post:
      tags: [Shifts]
      summary: Candidate Cancels Shift Claim
      description: Updates claim status to CANCELLED and returns slot to shift openings.
      security:
        - BearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Shift claim cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/shifts/claims/{claimId}/dispute:
    post:
      tags: [Shifts]
      summary: Candidate Raises Shift Dispute
      description: Marks claim as DISPUTED for admin investigation.
      security:
        - BearerAuth: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Dispute registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================================
  # CANDIDATE APPLICATIONS
  # ============================================================================
  /api/v1/applications/me:
    get:
      tags: [Applications]
      summary: List Candidate's Own Applications
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, CLOSED, ALL]
            default: ACTIVE
      responses:
        '200':
          description: Applications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'

  /api/v1/applications/{id}/withdraw:
    post:
      tags: [Applications]
      summary: Withdraw an Application
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawApplicationRequest'
      responses:
        '200':
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============================================================================
  # CANDIDATE EARNINGS & PAYOUTS
  # ============================================================================
  /api/v1/payouts/me:
    get:
      tags: [Payouts]
      summary: Candidate Earnings & Payout Ledger
      description: Monetary values reported in integer paise.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Earnings metrics and transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateEarningsResponse'

  /api/v1/payouts/me/method:
    put:
      tags: [Payouts]
      summary: Configure Bank Account or UPI Payout Method
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidatePayoutMethodRequest'
      responses:
        '200':
          description: Payout method updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/payouts/{payoutId}/slip:
    get:
      tags: [Payouts]
      summary: Download Official Locum Payout Slip (PDF)
      security:
        - BearerAuth: []
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Streamed PDF payout slip
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ============================================================================
  # CME LEARNING ACADEMY
  # ============================================================================
  /api/v1/courses:
    get:
      tags: [Courses]
      summary: Browse CME Courses & Modules
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummaryResponse'

  /api/v1/courses/{id}:
    get:
      tags: [Courses]
      summary: Get Course Details & Outline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummaryResponse'

  /api/v1/courses/{id}/enroll:
    post:
      tags: [Courses]
      summary: Enroll in Course
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/courses/{id}/progress:
    post:
      tags: [Courses]
      summary: Update Course Lesson Progress
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progressPercent]
              properties:
                progressPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/courses/{id}/certificate:
    post:
      tags: [Courses]
      summary: Generate and Issue CME Certificate
      description: Verifies 100% course completion before signing certificate.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Certificate issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificateRef:
                    type: string
                  issuedAt:
                    type: string
                    format: date-time

  # ============================================================================
  # CLINICAL COMMUNITY (HUDDLE)
  # ============================================================================
  /api/v1/huddle/posts:
    get:
      tags: [Huddle]
      summary: List Community Discussions
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [All, Thought, Experience, Case, Question, Update, Event]
        - name: field
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuddlePostPageResponse'
    post:
      tags: [Huddle]
      summary: Create Discussion Post or Case
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHuddlePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuddlePostResponse'

  /api/v1/huddle/posts/{id}/comments:
    get:
      tags: [Huddle]
      summary: Get Comments on a Post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HuddleCommentResponse'
    post:
      tags: [Huddle]
      summary: Add a Clinical Comment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
