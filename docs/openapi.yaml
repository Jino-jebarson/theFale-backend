            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HuddlePostResponse'

  /api/v1/admin/huddle/posts/{id}:
    delete:
      tags: [Admin Compliance]
      summary: Soft-Delete Violating Clinical Post
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/admin/huddle/users/{id}/moderation-status:
    put:
      tags: [Admin Compliance]
      summary: Mute or Suspend User from Clinical Huddle
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
